<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-labelledby="t d">
  <title id="t">Generate, execute, feed back</title>
  <desc id="d">A text prompt leads to model code generation, then Python/CAD execution. The execution result returns as error or visual feedback to the prompt side, closing the loop.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#444"/>
    </marker>
    <style>
      rect{fill:#f4f6f8;stroke:#444;stroke-width:1.5}
      text{font:14px sans-serif;fill:#222;text-anchor:middle}
      line,polyline{stroke:#444;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="230" style="fill:#fff;stroke:none"/>
  <rect x="20" y="20" width="180" height="60" rx="6"/>
  <text x="110" y="46">Text Prompt</text><text x="110" y="66">(User Request)</text>
  <rect x="290" y="20" width="180" height="60" rx="6"/>
  <text x="380" y="46">Model Code</text><text x="380" y="66">Generation</text>
  <rect x="560" y="20" width="180" height="60" rx="6"/>
  <text x="650" y="46">Python / CAD</text><text x="650" y="66">Execution</text>
  <line x1="200" y1="50" x2="288" y2="50" marker-end="url(#a)"/>
  <line x1="470" y1="50" x2="558" y2="50" marker-end="url(#a)"/>
  <polyline points="650,80 650,165 480,165" marker-end="url(#a)"/>
  <text x="590" y="155">(Execution Result)</text>
  <rect x="290" y="140" width="190" height="50" rx="6" style="fill:#f4f6f8"/>
  <text x="385" y="161">Error / Visual</text><text x="385" y="179">Feedback Loop</text>
  <polyline points="290,165 110,165 110,82" marker-end="url(#a)"/>
</svg>
