[project]
name = "cq-design-skill"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "cadquery>=2.6.1,<3",
    "trimesh>=4.0,<5",
    # matplotlib: headless preview rendering via Agg backend (no OpenGL required)
    "matplotlib>=3.7,<4",
    "pillow>=10,<13",
    "numpy>=1.24,<3",
    "lxml>=4.9,<7",
    "cq-warehouse",
    "python-fcl>=0.7.0.11",
    # scipy: required by trimesh's CollisionManager (is_convex) for the kinematic sweep
    "scipy>=1.10,<2",
    # networkx: required by trimesh's scene graph (3MF export path)
    "networkx>=3,<4",
]

[tool.uv.sources]
cq-warehouse = { git = "https://github.com/gumyr/cq_warehouse.git" }

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=9.0.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
