[project]
name = "cq-design-skill"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "cadquery>=2.8,<3",
    "trimesh>=4.0,<5",
    # matplotlib: headless preview rendering via Agg backend (no OpenGL required)
    "matplotlib>=3.7,<4",
    "pillow>=12.3.0,<13",
    "numpy>=1.24,<3",
    "lxml>=4.9,<7",
    # jsonschema: BUILD_PLAN.json draft-7 validation (enum + additionalProperties)
    "jsonschema>=4,<5",
    "cq-warehouse",
    "python-fcl>=0.7.0.11",
    # manifold3d: boolean engine behind trimesh.boolean -- the interference primitive
    # measures overlap as intersection VOLUME (fcl's contact depth is ill-conditioned on
    # the near-coplanar triangles flat printed faces tessellate into)
    "manifold3d>=2.3,<4",
    # scipy: required by trimesh's CollisionManager (is_convex) for the kinematic sweep
    "scipy>=1.10,<2",
    # networkx: required by trimesh's scene graph (3MF export path)
    "networkx>=3,<4",
    # rtree: required by trimesh.proximity (eval-harness Chamfer distance)
    "rtree>=1,<2",
    "xxhash>=4.0.1",
]

[tool.uv.sources]
cq-warehouse = { git = "https://github.com/gumyr/cq_warehouse.git" }

[tool.uv]
package = false
# dev tooling (pytest, ruff, mypy, basedpyright + its ~110 MB node runtime) is opt-in:
# `uv sync --group dev`. Keeps the installed skill env lean.
default-groups = []

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
    "mypy>=1.0",
    "basedpyright>=1.0",
    "types-jsonschema",
]
# Optional: src/fem_check.py's tet mesher and linear-static solver. Not in the default
# `dependencies` -- the advisor degrades to a stated skip without it (see the
# `fem-stress-advisor` capability), so the default skill install stays unchanged.
# `uv sync --group fem` to enable it.
fem = [
    "gmsh>=4.12,<5",
    "scikit-fem>=10,<11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the CADGenBench dataset (evals/runs/cadgenbench-data)"]

# Quality tooling targets py311, the project's minimum (cadquery 2.8 dropped 3.10;
# cadquery-ocp ships wheels through 3.14). Targeting the floor keeps pyupgrade/type
# checks from accepting syntax that breaks on 3.11.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

# Gradual adoption: this codebase predates type checking, so strict mode floods
# ~160 errors and makes the lint gate unusable. Start lenient (do NOT require
# annotations everywhere), keep the high-signal correctness checks on, and tighten
# toward strict module-by-module as annotations land.
[tool.mypy]
python_version = "3.11"
# Tests import src/ modules directly (conftest.py injects src into sys.path); tell
# the checkers where to resolve them.
mypy_path = "src"
strict = false
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
check_untyped_defs = true

# CAD / scientific deps ship no type stubs; ignore their missing imports.
# Tests exercise CadQuery/trimesh objects whose stub return types are broad unions
# (Workplane.val() -> Vector|Location|Shape|Sketch, trimesh.load() -> Geometry).
# Type-checking assertion code against those is high-noise/low-value, so CAD-heavy
# test files carry a top-of-file `# mypy: ignore-errors` / `# type: ignore` and are
# linted by ruff only. src/ remains fully type-checked. (mypy override patterns can't
# match the bare, non-package `test_*` module names, hence the per-file directive.)
[[tool.mypy.overrides]]
module = [
    "cadquery.*",
    "cq_warehouse.*",
    "trimesh.*",
    "fcl",
    "manifold3d",
    "scipy.*",
    "matplotlib.*",
    "mpl_toolkits.*",
    "networkx.*",
    "OCP.*",
    # optional `fem` dependency group (src/fem_check.py) -- ships no type stubs, and
    # may not be installed at all (default `uv sync` omits it; see pyproject's `fem`
    # dependency-group comment), so missing-import must not fail type-checking.
    "gmsh",
    "skfem.*",
]
ignore_missing_imports = true

[tool.basedpyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
exclude = ["tests"]  # tests are ruff-linted but not type-checked (see mypy note above)
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
